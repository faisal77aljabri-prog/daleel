<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EC Portfolio — دليل</title>
  <meta name="description" content="Build and manage your extracurricular portfolio with AI feedback." />
  <link rel="stylesheet" href="css/styles.css?v=10" />
</head>
<body>

<nav class="navbar">
  <div class="container">
    <a href="index.html" class="nav-logo">
      <span class="logo-arabic">دليل</span>
      <span class="logo-dot"></span>
    </a>
    <div class="nav-links">
      <a href="index.html" data-i18n="nav.home">Home</a>
      <a href="profile.html" class="btn btn-outline btn-sm">👤 My Profile</a>
    </div>
    <div class="nav-right">
      <button class="lang-toggle" onclick="toggleLanguage()">عربي</button>
      <button class="hamburger" aria-label="Menu"><span></span><span></span><span></span></button>
    </div>
  </div>
</nav>

<div class="page-header">
  <div class="page-header-icon">⚡</div>
  <h1>EC Portfolio</h1>
  <p>Add your extracurriculars, get AI feedback, present them better to universities.</p>
</div>

<section class="section">
  <div class="container">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:32px;align-items:start">

      <!-- Left: Add EC Form -->
      <div>
        <div class="form-card" data-anim>
          <div class="form-section-title">➕ Add an Activity</div>
          <div class="form-grid">
            <div class="form-group full">
              <label for="ecName">Activity Name *</label>
              <input type="text" id="ecName" placeholder="e.g., Robotics Club, Science Fair Winner" required />
            </div>

            <div class="form-group full">
              <label for="ecDescription">Detailed Description *</label>
              <textarea id="ecDescription" placeholder="What did you do? What was your role? Why did it matter?" style="min-height:120px;resize:vertical"></textarea>
              <small>Be specific: &quot;Led 20 students to build a robot&quot; not just &quot;did robotics&quot;</small>
            </div>

            <div class="form-group full">
              <label for="ecImpact">Impact & Outcomes</label>
              <textarea id="ecImpact" placeholder="What was the result? Awards? Recognition? How many people affected?" style="min-height:80px;resize:vertical"></textarea>
            </div>

            <div class="form-group">
              <label for="ecDuration">Duration</label>
              <input type="text" id="ecDuration" placeholder="e.g., 2019-2023 (4 years), Sept-Dec 2024" />
            </div>

            <div class="form-group full">
              <label for="ecAwards">Awards & Honors</label>
              <input type="text" id="ecAwards" placeholder="Optional: state/national awards, scholarships, recognition" />
            </div>
          </div>

          <button class="btn btn-primary" onclick="addEC()" style="width:100%;margin-top:16px">
            ➕ Add to Portfolio
          </button>
        </div>
      </div>

      <!-- Right: Saved ECs List -->
      <div>
        <div class="form-card" data-anim style="animation-delay:0.1s">
          <div class="form-section-title">Your Portfolio</div>
          <div id="savedECsList" style="max-height:600px;overflow-y:auto">
            <p style="color:var(--text-muted);text-align:center;padding:40px">Loading…</p>
          </div>
        </div>
      </div>

    </div>
  </div>
</section>

<footer>
  <div class="container">
    <div class="footer-bottom">
      <p>Powered by Llama 3.3 · Groq · 2025</p>
    </div>
  </div>
</footer>

<style>
  .ec-portfolio-card {
    background: linear-gradient(135deg, rgba(183, 156, 224, 0.08), rgba(212, 176, 240, 0.05));
    border: 1px solid rgba(183, 156, 224, 0.2);
    border-radius: var(--radius-md);
    padding: 16px;
    margin-bottom: 16px;
    animation: fadeInUp 0.4s ease-out backwards;
  }

  .ec-card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 12px;
  }

  .ec-portfolio-card h4 {
    color: var(--text-dark);
  }

  textarea {
    font-family: inherit;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 1rem;
    transition: all 0.3s ease;
  }

  textarea:focus {
    border-color: var(--gold);
    box-shadow: 0 0 0 4px rgba(183, 156, 224, 0.15);
    outline: none;
  }

  .form-group small {
    display: block;
    margin-top: 6px;
    font-size: 0.8rem;
    color: var(--text-muted);
  }
</style>

<script src="js/translations.js?v=7"></script>
<script src="js/app.js?v=5"></script>
<script src="js/auth.js?v=5"></script>
<script src="js/ec-portfolio.js?v=7"></script>
<script src="js/sidebar.js?v=8"></script>
</body>
</html>
